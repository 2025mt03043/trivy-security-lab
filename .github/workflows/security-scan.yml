
name: Container Supply Chain Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  container-security:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Node 20 baseline image
        run: |
          docker build --pull \
            -f Dockerfile.baseline \
            -t trivy-security-lab:baseline .

      - name: Build Node 24 hardened image
        run: |
          docker build --pull \
            -f Dockerfile.hardened \
            -t trivy-security-lab:hardened .

      - name: Generate baseline vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: trivy-security-lab:baseline
          format: json
          output: reports/baseline-report.json
          exit-code: '0'

      - name: Generate hardened vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: trivy-security-lab:hardened
          format: json
          output: reports/hardened-report.json
          exit-code: '0'

      - name: Generate baseline SBOM
        run: |
          trivy image \
            --format cyclonedx \
            --output reports/baseline-sbom.cdx.json \
            trivy-security-lab:baseline

      - name: Generate hardened SBOM
        run: |
          trivy image \
            --format cyclonedx \
            --output reports/hardened-sbom.cdx.json \
            trivy-security-lab:hardened

      - name: Compare vulnerability counts
        run: |
          for report in reports/baseline-report.json reports/hardened-report.json
          do
            echo "===== $report ====="
            jq '
              [.Results[]?.Vulnerabilities[]?] |
              {
                Critical: ([.[] | select(.Severity == "CRITICAL")] | length),
                High: ([.[] | select(.Severity == "HIGH")] | length),
                Medium: ([.[] | select(.Severity == "MEDIUM")] | length),
                Low: ([.[] | select(.Severity == "LOW")] | length)
              }
            ' "$report"
          done

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-security-evidence
          path: reports/
          retention-days: 30
