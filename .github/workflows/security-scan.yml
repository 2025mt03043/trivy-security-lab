
name: Container Supply Chain Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    name: Build, Scan and Generate SBOM
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Docker image
        run: |
          docker build -t trivy-security-lab:${{ github.sha }} .

      # Generate a full vulnerability report without stopping the pipeline.
      - name: Generate vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: trivy-security-lab:${{ github.sha }}
          format: json
          output: reports/trivy-report.json
          exit-code: '0'

      # Generate software bill of materials.
      - name: Generate CycloneDX SBOM
        run: |
          trivy image \
            --format cyclonedx \
            --output reports/sbom.cdx.json \
            trivy-security-lab:${{ github.sha }}

      # Enforce the security policy.
      - name: Enforce vulnerability threshold
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: trivy-security-lab:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true

      # Upload reports even when the security gate fails.
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-security-reports
          path: reports/
          retention-days: 30
